  button.blk.ghost::before { background: var(--tex-dark) 0 0 / 24px 24px; box-shadow: inset 3px 3px 0 rgba(120,100,101,.55), inset -3px -3px 0 #0d0909; }
  button.blk:active { translate: 0 3px; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .res b.dn { display: block; font-size: 60px; line-height: 1.05; }
  .verdict { margin: 4px 0 0; font-size: 24px; font-weight: 900; }
  .verdict.win { color: var(--gold); text-shadow: 0 0 24px rgba(255,201,60,.5); }
  .verdict.lose { color: #ff8a7a; }
  .name { width: 100%; height: 48px; border: 0; border-radius: 14px; padding: 0 14px; font: inherit; font-size: 15px; font-weight: 600; color: #fff; text-align: right;
    background: linear-gradient(rgba(14,10,10,.62), rgba(14,10,10,.5)), var(--tex-dark) 0 0 / 24px 24px; image-rendering: pixelated;
    box-shadow: inset 0 0 0 1.5px #000, inset 0 7px 10px -3px rgba(0,0,0,.9); }
  .name:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--gold), inset 0 7px 10px -3px rgba(0,0,0,.9); }
  .name::placeholder { color: #6e6061; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; top: -12px; width: 10px; height: 10px; image-rendering: pixelated; animation: drop 1.6s ease-in forwards; }
  @keyframes drop { to { transform: translateY(110vh) rotate(540deg); } }
  .foot { font-size: 12px; color: rgba(255,255,255,.4); }
</style>
</head>
<body>
<div class="wrap">
  <header><img src="remote-icon.png" alt="" /><b>NUKE GG</b></header>
  <div id="main"></div>
  <p class="foot">لعبة صغيرة من NUKE GG · ما ينحفظ عندنا شي</p>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const h = new URLSearchParams(location.hash.slice(1));
const mode = h.get("m") === "blocks" ? "blocks" : "circle";
const theirs = Math.round(Number(h.get("s"))) || null;
const who = (h.get("n") || "").slice(0, 20).trim() || "واحد من ربعك";
const modeWord = mode === "blocks" ? "خمس بلوكات تطلع، تضغطها بأسرع ما تقدر" : "أول ما تخضرّ الدائرة اضغطها";

function intro() {
  $("main").innerHTML = (theirs
    ? `<div class="vs"><small><span class="who" dir="auto">${esc(who)}</span> يتحدّاك</small><b class="dn">${theirs} ms</b><small>ردة فعله${mode === "blocks" ? " بالخمس بلوكات" : ""}</small></div><h1>تقدر تغلبه؟</h1>`
    : "<h1>كم سرعتك؟</h1>") + `<p class="hint">${modeWord}</p><button class="blk" id="go">العب</button>`;
  $("go").addEventListener("click", play);
}
function play() {
  $("main").innerHTML = '<div id="box"></div>';
  const start = () => (window.NKRx ? NKRx.play($("box"), mode, done) : setTimeout(start, 150));
  start();
}
function confetti() {
  const box = document.createElement("div");
  box.className = "confetti";
  const cols = ["#ef3b2d", "#ff8a1f", "#ffc93c", "#5fd35f", "#fff"];
  for (let i = 0; i < 46; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = cols[i % cols.length];
    p.style.animationDelay = Math.random() * 0.5 + "s";
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2600);
}
function done(ms) {
  let best = null;
  try { best = Number(localStorage.getItem("nk-rx-best-" + mode)) || null; if (!best || ms < best) localStorage.setItem("nk-rx-best-" + mode, String(ms)); } catch {}
  const won = theirs != null && ms < theirs, tie = theirs != null && ms === theirs;
  let name = "";
  try { name = localStorage.getItem("nk-fun-name") || ""; } catch {}
  $("main").innerHTML = `<div class="res"><b class="dn">${ms} ms</b><span class="hint">${NKRx.rank(ms)}</span>` +
    (theirs != null ? `<p class="verdict ${won ? "win" : tie ? "" : "lose"}">${won ? `غلبت ${esc(who)}! 🏆` : tie ? "تعادل!" : `${esc(who)} أسرع منك بـ <span class="dn">${ms - theirs} ms</span>`}</p>` : "") +
    `</div><input id="name" class="name" maxlength="20" dir="auto" placeholder="اسمك (يشوفه اللي ترسل له)" value="${esc(name)}" />` +
    '<div class="row"><button class="blk" id="send">رد التحدّي</button><button class="blk ghost" id="again">مرة ثانية</button></div>';
  if (won) confetti();
  navigator.vibrate?.(won ? [30, 60, 30] : 20);
  $("again").addEventListener("click", play);
  $("send").addEventListener("click", async () => {
    const n = $("name").value.trim().slice(0, 20);
    try { localStorage.setItem("nk-fun-name", n); } catch {}
    const url = new URL(location.href);
    url.hash = new URLSearchParams({ m: mode, s: String(ms), n }).toString();
    const text = theirs != null && won ? `غلبتك! ${ms} ms، تقدر ترد؟` : `ردة فعلي ${ms} ms، تقدر تغلبني؟`;
    try {
      if (navigator.share) await navigator.share({ text, url: url.href });
      else { await navigator.clipboard.writeText(`${text} ${url.href}`); $("send").textContent = "انسخ ✓"; }
    } catch {}
  });
}
intro();
</script>
</body>
</html>
