<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e0a0a" />

<title>أرسل للبيسي · NUKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" crossorigin />
<!--
  «استقبل من جوال أي أحد» — the page a phone's camera opens from the QR on someone's PC (electron/features/quicksend.cjs).
  No app, no pairing, no account: the QR carries a one-time key; everything about the session is sealed with it over
  NUKE's relay (AES-256-GCM, the same as the phone link), and the files go straight to the PC over a WebRTC data channel
  in raw pieces (full quality, nothing re-encoded) — or sealed pieces over the relay when no direct link opens.
  Every piece carries its offset and the other side says how far it really is, so leaving the page, the screen going off
  or the network changing only pauses a file: when the page is back it carries on from that byte (both ways). A phone
  can't keep a web page running in the background for long (an iPhone stops it at once), so the page says so honestly
  and keeps the screen on (Wake Lock) while something is moving.
-->
<style>
  :root { --bg:#0e0a0a; --card:#171213; --card2:#1e1718; --line:rgba(255,255,255,.08); --dim:rgba(255,255,255,.55); --red:#ef3b2d; --flame:#ff8a1f; --gold:#ffc93c; --green:#34d399; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: #fff; font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  body { min-height: 100dvh; padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 30% at 50% 18%, rgba(239,59,45,.16), transparent 72%); }
  .wrap { position: relative; max-width: 480px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin: 6px 0 18px; }
  header img { width: 46px; height: 46px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(239,59,45,.5)); }
  header h1 { margin: 0; font-size: 19px; font-weight: 700; overflow-wrap: anywhere; }
  header p { margin: 2px 0 0; font-size: 12.5px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.25); flex-shrink: 0; }
  .dot.on { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .dot.warn { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 16px; margin-bottom: 12px; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; -webkit-user-select: none; user-select: none; }
  .me { display: flex; align-items: center; gap: 12px; }
  .av { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 20px; color: #0e0a0a; flex-shrink: 0; box-shadow: 0 6px 18px -6px currentColor; }
  input.name { flex: 1; min-width: 0; min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--card2); color: #fff; font: inherit; font-size: 16px; padding: 0 14px; }
  .colors { display: flex; gap: 10px; margin-top: 12px; justify-content: center; }
  .colors button { width: 30px; height: 30px; border-radius: 50%; outline: 3px solid transparent; outline-offset: 2px; transition: outline-color .15s; }
  .colors button.on { outline-color: #fff; }
  .big { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 120px; border-radius: 22px; background: var(--card2); border: 1px solid var(--line); font-weight: 700; font-size: 15px; transition: transform .12s; }
  .pick:active { transform: scale(.96); }
  .pick.main { background: var(--red); border-color: var(--red); box-shadow: 0 12px 30px -12px rgba(239,59,45,.9); }
  .pick svg { width: 30px; height: 30px; }
  .hint { font-size: 12.5px; color: var(--dim); line-height: 1.7; margin: 10px 4px 0; text-align: center; }
  .sum { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 2px 10px; }
  .sum b { font-size: 15px; }
  .sum span { font-size: 12.5px; color: var(--dim); direction: ltr; white-space: nowrap; }
  .bar { height: 8px; border-radius: 8px; background: rgba(255,255,255,.08); overflow: hidden; margin-bottom: 10px; }
  .bar > div { height: 100%; width: 0; border-radius: 8px; background: linear-gradient(90deg, var(--gold), var(--red)); transition: width .2s; }
  .bar.stuck > div { background: var(--gold); opacity: .6; }
  .note { font-size: 13px; line-height: 1.6; margin: -2px 2px 10px; color: var(--gold); font-weight: 600; }
  .leave { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; line-height: 1.65; color: var(--dim); background: rgba(255,255,255,.035); border-radius: 14px; padding: 9px 11px; margin: 0 0 12px; }
  .leave b { color: #fff; font-weight: 600; }
  .list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .it { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--card2); display: grid; place-items: center; font-size: 11px; color: var(--dim); text-align: center; padding: 4px; overflow-wrap: anywhere; transition: opacity .25s, transform .25s; }
  .it img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .it .ring { position: absolute; inset: 0; background: rgba(14,10,10,.55); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; direction: ltr; transition: opacity .3s; }
  .it.wait .ring { font-size: 11px; direction: rtl; }
  .it.stuck .ring { color: var(--gold); }
  .it.done .ring { opacity: 0; }
  .it .ok { position: absolute; bottom: 5px; inset-inline-start: 5px; width: 20px; height: 20px; border-radius: 50%; background: var(--green); color: #0e0a0a; display: grid; place-items: center; font-size: 12px; font-weight: 700; transform: scale(0); transition: transform .35s cubic-bezier(.2,1.6,.4,1); }
  .it.done .ok { transform: scale(1); }
  .it .x { position: absolute; top: 3px; inset-inline-end: 3px; width: 28px; height: 28px; border-radius: 50%; background: rgba(14,10,10,.75); color: #fff; font-size: 15px; line-height: 1; display: grid; place-items: center; z-index: 2; }
  .it.done .x, .it.gone .x { display: none; }
  .it.out { opacity: 0; transform: scale(.7); }
  .it.gone { opacity: .45; }
  .it.gone .ring { opacity: 1; font-size: 11px; direction: rtl; background: rgba(14,10,10,.7); }
  .it.gone .ok { display: none; }
  .done-card { text-align: center; padding: 22px 16px; }
  .done-card .big-ok { font-size: 46px; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .rx { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: var(--card2); margin-top: 8px; min-height: 58px; }
  .rx .n { flex: 1; min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rx .n small { display: block; font-size: 11.5px; color: var(--dim); }
  .rx .n small.warn { color: var(--gold); }
  .rx .save { min-height: 38px; padding: 0 14px; border-radius: 12px; background: var(--red); font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .rx .pct { font-size: 12px; color: var(--dim); direction: ltr; flex-shrink: 0; }
  .rx .x2 { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.08); font-size: 15px; flex-shrink: 0; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .confetti i { position: absolute; top: -10px; width: 8px; height: 14px; border-radius: 2px; animation: fall 1.8s ease-in forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .6; } }
  .err { text-align: center; padding: 30px 18px; }
  .err b { display: block; font-size: 18px; margin-bottom: 8px; }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } * { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="remote-icon.png" alt="" />
    <div>
      <h1 id="title">ترسل للبيسي</h1>
      <p><span id="dot" class="dot"></span><span id="status">نتصل…</span></p>
    </div>
  </header>

  <div id="bad" class="card err hidden"><b>هالكود انتهى</b>اطلب من صاحب البيسي يفتح «استقبل من جوال» مرة ثانية، وصوّر الكود الجديد.</div>

  <div id="main" class="hidden">
    <div class="card">
      <div class="me">
        <div id="av" class="av">؟</div>
        <input id="name" class="name" maxlength="24" placeholder="اسمك (يطلع عنده)" autocomplete="nickname" />
      </div>
      <div id="colors" class="colors"></div>
    </div>

    <div class="card">
      <div class="big">
        <button id="pickPhotos" class="pick main"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>صور وفيديو</button>
        <button id="pickFiles" class="pick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/></svg>ملفات</button>
      </div>
      <input id="inPhotos" type="file" accept="image/*,video/*" multiple hidden />
      <input id="inFiles" type="file" multiple hidden />
      <p id="hint" class="hint">توصل بجودتها الأصلية. وعلى نفس الواي فاي توصل بأسرع شي.</p>
    </div>

    <div id="leftCard" class="card hidden">
      <b style="font-size:14px">ما كمل من قبل</b>
      <p class="hint" style="text-align:start;margin:4px 2px 0">اختر نفس الملف مرة ثانية ويكمل من مكانه.</p>
      <div id="leftList"></div>
    </div>

    <div id="sending" class="card hidden">
      <div class="sum"><b id="sumText">نرسل…</b><span id="speed"></span></div>
      <div id="barBox" class="bar"><div id="bar"></div></div>
      <p id="note" class="note hidden"></p>
      <p id="leave" class="leave hidden"></p>
      <div id="list" class="list"></div>
    </div>

    <div id="doneCard" class="card done-card hidden">
      <div class="big-ok">✅</div>
      <b id="doneText">وصلت كلها</b>
      <p class="hint">تقدر ترسل غيرها من فوق.</p>
    </div>

    <div id="rxCard" class="card hidden">
      <b style="font-size:14px">من البيسي لجوالك</b>
      <div id="rx"></div>
    </div>
  </div>
</div>
<div id="confetti" class="confetti"></div>

<script type="module">
const RELAY_URL = "wss://nuke-relay.nuke-gcc.workers.dev/ws";
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const COLORS = ["#ef3b2d", "#ff8a1f", "#ffc93c", "#34d399", "#38bdf8", "#a78bfa", "#f472b6"];
const ICE = [{ urls: ["stun:stun.cloudflare.com:3478", "stun:stun.l.google.com:19302"] }];
const PIECE = 192 * 1024; // a data channel message tops out at 256 KB (with the 12-byte header)
const RELAY_PIECE = 96 * 1024;
const RELAY_MAX = 200 * 1024 ** 2; // bigger files only go over the direct link
const RELAY_WINDOW = 8 * RELAY_PIECE;
const AHEAD = 48 * 1024 ** 2; // bytes sent beyond what the PC said it has
const STALL_MS = 8000;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
// sizes stay left to right inside Arabic lines ("300 MB", never "MB 300")
const mb = (n) => `⁦${n >= 1024 ** 3 ? `${(n / 1024 ** 3).toFixed(1)} GB` : `${Math.max(0.1, n / 1024 ** 2).toFixed(n < 10 * 1024 ** 2 ? 1 : 0)} MB`}⁩`;
const pct = (a, b) => `⁦${Math.floor((a / Math.max(1, b)) * 100)}%⁩`;

// ---- the key from the QR (never sent anywhere: only its hash names the relay room) ----
const b64u = (u8) => {
  let bin = "";
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode(...u8.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
};
const fromB64u = (s) => Uint8Array.from(atob(String(s).replace(/-/g, "+").replace(/_/g, "/") + "===".slice((String(s).length + 3) % 4)), (c) => c.charCodeAt(0));
const b64 = (u8) => {
  let bin = "";
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode(...u8.subarray(i, i + 0x8000));
  return btoa(bin);
};
const q = new URLSearchParams(location.hash.slice(1));
let raw = null;
try {
  raw = q.get("k") ? fromB64u(q.get("k")) : null;
} catch {}
const pcLabel = q.get("n") || "البيسي";
$("title").textContent = `ترسل لـ ${pcLabel}`;
document.title = `أرسل لـ ${pcLabel} · NUKE`;
if (!raw || raw.length !== 32) {
  $("bad").classList.remove("hidden");
  throw new Error("no key");
}
const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
const chanName = "nk-" + [...new Uint8Array(await crypto.subtle.digest("SHA-256", raw))].map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 40);
async function seal(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify({ ...obj, ts: Date.now() }))));
  return { iv: b64u(iv), ct: b64u(ct) };
}
async function unseal(m) {
  try {
    return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64u(m.iv) }, key, fromB64u(m.ct))));
  } catch {
    return null;
  }
}

// ---- who I am (kept on this phone; the same id for this code, so a page opened again is the same sender) ----
const store = (k, v) => {
  try {
    if (v === undefined) return localStorage.getItem(k);
    localStorage.setItem(k, v);
  } catch {}
  return null;
};
const ME = (() => {
  let id = store(`nk-send-id:${chanName}`);
  if (!id || !/^[0-9a-f-]{8,40}$/.test(id)) store(`nk-send-id:${chanName}`, (id = crypto.randomUUID().slice(0, 12)));
  let saved = {};
  try {
    saved = JSON.parse(store("nk-send-me") || "{}");
  } catch {}
  return { id, name: String(saved.name || "").slice(0, 24), color: COLORS.includes(saved.color) ? saved.color : COLORS[Math.floor(Math.random() * COLORS.length)] };
})();
function paintMe() {
  $("av").style.background = ME.color;
  $("av").style.color = "#0e0a0a";
  $("av").textContent = ([...ME.name.trim()][0] || "؟").toUpperCase();
  $("colors").innerHTML = COLORS.map((c) => `<button aria-label="لون" data-c="${c}" style="background:${c}" class="${c === ME.color ? "on" : ""}"></button>`).join("");
  $("colors").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => ((ME.color = b.dataset.c), saveMe())));
}
function saveMe() {
  store("nk-send-me", JSON.stringify({ name: ME.name, color: ME.color }));
  paintMe();
  if (welcomed) void sayHello();
}
$("name").value = ME.name;
let nameT;
$("name").addEventListener("input", () => {
  ME.name = $("name").value.slice(0, 24);
  paintMe();
  clearTimeout(nameT);
  nameT = setTimeout(saveMe, 600);
});
paintMe();

// ---- small waits: "a:<fid>" (an ack), "w:<fid>" (the PC's answer about a file), "link" (a link came back) ----
const waits = new Map();
function waitFor(k, ms) {
  return new Promise((resolve) => {
    const list = waits.get(k) ?? [];
    const done = (v) => {
      clearTimeout(t);
      const l = waits.get(k);
      if (l) {
        l.splice(l.indexOf(done) >>> 0, 1);
        if (!l.length) waits.delete(k);
      }
      resolve(v);
    };
    const t = setTimeout(() => done(null), ms);
    list.push(done);
    waits.set(k, list);
  });
}
const poke = (k, v = true) => [...(waits.get(k) ?? [])].forEach((f) => f(v));
const nap = (ms) => waitFor("link", ms);

// ---- NUKE's relay (only the session's sealed messages) ----
let ws = null;
let tries = 0;
let reT = 0;
let welcomed = false;
let ended = false;
let fresh = true; // until the PC has seen this page once: it may hold half files from an earlier visit
function relay() {
  if (ended) return;
  clearTimeout(reT);
  const sock = new WebSocket(`${RELAY_URL}?ch=${encodeURIComponent(chanName)}`);
  ws = sock;
  sock.lastIn = Date.now();
  sock.onopen = () => {
    tries = 0;
    sock.lastIn = Date.now();
    void sayHello();
    sock.ping = setInterval(() => sock.readyState === 1 && sock.send("ping"), 30e3);
    status();
  };
  sock.onmessage = async (e) => {
    sock.lastIn = Date.now();
    if (typeof e.data !== "string" || e.data === "pong") return;
    let p;
    try {
      p = JSON.parse(e.data);
    } catch {
      return;
    }
    if (p?.from !== "pc" || (p.to && p.to !== ME.id)) return;
    const m = await unseal(p.s);
    if (m) onPc(m, "relay");
  };
  sock.onclose = () => {
    clearInterval(sock.ping);
    if (ws !== sock) return;
    ws = null;
    status();
    if (!ended) reT = setTimeout(relay, document.visibilityState === "visible" ? Math.min(15e3, 1000 * 2 ** tries++) : 5000);
  };
}
async function say(msg) {
  const sock = ws;
  if (sock?.readyState !== 1) return false;
  const body = JSON.stringify({ from: ME.id, s: await seal(msg) });
  try {
    if (sock.readyState !== 1) return false;
    sock.send(body);
    return true;
  } catch {
    return false;
  }
}
const sayHello = () => say({ t: "hello", id: ME.id, name: ME.name, color: ME.color, fresh });
const dcOpen = () => dc?.readyState === "open";
function send(msg) {
  if (dcOpen()) {
    try {
      dc.send(JSON.stringify(msg));
      return true;
    } catch {}
  }
  return say(msg);
}

// ---- the direct link ----
let pc = null;
let dc = null;
let rtcAt = 0;
function status() {
  const relayOn = ws?.readyState === 1;
  const on = welcomed && (relayOn || dcOpen());
  $("dot").className = "dot" + (on ? " on" : welcomed ? " warn" : "");
  $("status").textContent = ended ? "انتهى" : !welcomed ? "نتصل… (لازم «استقبل من جوال» يكون مفتوح بالبيسي)" : dcOpen() ? "متصل مباشرة ⚡" : relayOn ? "متصل" : "نرجع نتصل…";
}
async function direct() {
  if (!window.RTCPeerConnection || !welcomed || ended || dcOpen()) return;
  if (pc && Date.now() - rtcAt < 15e3) return; // one try at a time
  try {
    pc?.close();
  } catch {}
  rtcAt = Date.now();
  const me = (pc = new RTCPeerConnection({ iceServers: ICE }));
  const ch = me.createDataChannel("nk", { ordered: true });
  ch.binaryType = "arraybuffer";
  ch.onopen = () => {
    if (pc !== me) return void ch.close();
    dc = ch;
    ch.lastIn = Date.now();
    status();
    poke("link");
    rxResumeAll();
    void upPump();
  };
  ch.onclose = () => {
    if (dc === ch) dc = null;
    if (pc === me) pc = null;
    status();
    // something was moving: the direct link again in a moment (big files wait for it)
    if (pc === null && busy()) setTimeout(() => document.visibilityState === "visible" && direct(), 1500);
  };
  ch.onmessage = (e) => {
    ch.lastIn = Date.now();
    if (e.data instanceof ArrayBuffer) return onPiece(e.data);
    if (typeof e.data === "string" && e.data !== "hb") {
      try {
        onPc(JSON.parse(e.data), "direct");
      } catch {}
    }
  };
  me.onicecandidate = (e) => e.candidate && say({ t: "rtc-ice", c: e.candidate.toJSON() });
  me.onconnectionstatechange = () => {
    if (!["failed", "closed", "disconnected"].includes(me.connectionState) || pc !== me) return;
    if (me.connectionState === "disconnected") return; // (it often comes back by itself; "failed" follows if not)
    pc = null;
    if (dc === ch) dc = null;
    status();
    if (busy()) setTimeout(() => document.visibilityState === "visible" && direct(), 1500);
  };
  try {
    await me.setLocalDescription(await me.createOffer());
    await say({ t: "rtc-offer", sdp: me.localDescription.sdp });
  } catch {}
}
// a link that died while the phone was away still says "open": a quick knock tells
function knock() {
  if (dcOpen()) {
    const ch = dc;
    const t0 = Date.now();
    try {
      ch.send("hb");
    } catch {}
    setTimeout(() => {
      if (dc === ch && ch.lastIn < t0) {
        try {
          pc?.close();
        } catch {}
        dc = null;
        pc = null;
        status();
        void direct();
      }
    }, 3500);
  }
  if (ws?.readyState === 1) {
    const sock = ws;
    const t0 = Date.now();
    try {
      sock.send("ping");
    } catch {}

  if (r.partBytes >= 8 * 1024 * 1024) (r.blobs.push(new Blob(r.parts)), (r.parts = []), (r.partBytes = 0));
  rack(r, Boolean(relayMsg));
  paintRx(r);
}
function rack(r, now) {
  const t = Date.now();
  clearTimeout(r.ackT);
  if (now || r.got - r.ackGot >= 1024 * 1024 || t - r.ackAt >= 300 || r.got >= r.size) {
    r.ackGot = r.got;
    r.ackAt = t;
    return void send({ t: "rack", fid: r.fid, got: r.got });
  }

}
const limits = new Map();
function rateLimited(k, fn) {
  if (Date.now() - (limits.get(k) ?? 0) < 1500) return;
  limits.set(k, Date.now());
  fn();
}
function rxEnd(m) {
  const r = rx.get(Number(m.fid));
  if (!r) return void send({ t: "cancel", fid: Number(m.fid) });
  if (r.state === "done") return void send({ t: "rgot", fid: r.fid });
  if (r.state !== "get") return;
  if (r.got < r.size) return void send({ t: "rresume", fid: r.fid, got: r.got });
  const file = new File([...r.blobs, ...r.parts], r.name, { type: r.type });
  r.blobs = [];
  r.parts = [];
  r.state = "done";
  r.file = file;
  void send({ t: "rgot", fid: r.fid });
  const b = document.createElement("button");
  b.className = "save";
  b.textContent = "احفظه";
  b.addEventListener("click", async () => {
    try {
      if (navigator.canShare?.({ files: [file] })) return void (await navigator.share({ files: [file] }));
    } catch (e) {
      if (e?.name === "AbortError") return; // closed the share sheet
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file);
    a.download = r.name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60e3);
  });
  r.el.querySelector(".x2").remove();
  r.el.querySelector(".pct").remove();
  r.el.append(b);
  paintRx(r);

}
function rxDrop(r, why) {
  r.state = "cancel";
  r.blobs = [];
  r.parts = [];
  if (why) {
    const sm = r.el.querySelector("small");
    sm.textContent = why;
    sm.className = "warn";
    r.el.querySelector(".x2")?.remove();
    r.el.querySelector(".pct")?.remove();
    r.el.style.opacity = ".55";

}
function paintRx(r) {
  if (r.state === "done") {
    r.el.querySelector("small").textContent = mb(r.size);
    r.el.querySelector("small").className = "";
    return;
  }
  const pe = r.el.querySelector(".pct");
  if (pe) pe.textContent = pct(r.got, r.size);
  // the PC sends one file at a time: the others wait their turn (that isn't "stuck")
  const moving = [...rx.values()].find((x) => x.state === "get" && x.got > 0 && x.got < x.size);
  const queued = r.got === 0 && moving && moving !== r;
  const stuck = !queued && Date.now() - r.last > STALL_MS;
  const sm = r.el.querySelector("small");
  sm.textContent = queued ? `بالدور · ${mb(r.size)}` : stuck ? (r.got ? "علّق… يكمل من نفس المكان" : "ننتظر البيسي…") : `${mb(r.got)} من ${mb(r.size)}`;
  sm.className = stuck ? "warn" : "";
}

// ---- keep the screen on while something is moving ----
let lock = null;
const busy = () => [...ups.values()].some(live) || [...rx.values()].some((r) => r.state === "get");
async function lockCheck() {
  if (busy() && document.visibilityState === "visible" && !ended) {
    if (lock || !navigator.wakeLock) return;
    try {
      lock = await navigator.wakeLock.request("screen");
      lock.addEventListener("release", () => (lock = null));
    } catch {}
  } else if (lock) {
    const l = lock;
    lock = null;
    l.release().catch(() => {});
  }
}

// ---- leaving and coming back ----
function comeBack() {
  if (ended) return;
  if (!ws || ws.readyState > 1) {
    tries = 0;
    relay();
  } else if (welcomed) void send({ t: "back" });
  knock();
  if (welcomed && !dcOpen()) void direct();
  rxResumeAll();
  poke("link");
  void upPump();
  void lockCheck();
  render();
}
// "away" / "bye" sealed ahead of time: when the page is hidden or closed there's no time to wait for the encryption
const preSealed = {};
async function reseal() {
  for (const t of ["away", "bye"]) preSealed[t] = await seal({ t });
}
setInterval(() => welcomed && void reseal(), 4 * 60e3);
function sayNow(t) {
  if (dcOpen()) {
    try {
      return void dc.send(JSON.stringify({ t }));
    } catch {}
  }
  if (ws?.readyState === 1 && preSealed[t]) {
    try {
      ws.send(JSON.stringify({ from: ME.id, s: preSealed[t] }));
    } catch {}
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    if (welcomed && busy()) sayNow("away");
  } else comeBack();
});
document.addEventListener("resume", comeBack); // (a frozen page woken again)
addEventListener("online", comeBack);
addEventListener("pageshow", (e) => e.persisted && comeBack());
addEventListener("pagehide", (e) => {
  // closed for good → the PC keeps its half files a while; only put aside (it may come back) → just "away"
  if (welcomed) sayNow(e.persisted ? "away" : "bye");
});
// once a second while something is moving: «علّق» shows by itself, the direct link is tried again
let tick = 0;
setInterval(() => {
  if (document.visibilityState !== "visible") return;
  if (busy()) {
    render();
    for (const r of rx.values()) if (r.state === "get") paintRx(r);
  }
  if (++tick % 20 === 0 && welcomed && !dcOpen()) void direct();
  if (tick % 60 === 0 && welcomed) void send({ t: "here" }); // (the PC knows the page is still open)
}, 1000);

// a new code opened in the same tab (only the part after # changes, so the browser wouldn't load the page again)
addEventListener("hashchange", () => location.reload());

status();
relay();
